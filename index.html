      name="description"
      content="히라가나와 가타카나를 한국어 독음으로 맞추며 외우는 무료 플래시카드 앱. 틀린 글자가 더 자주 나오는 간격 반복 학습, 연속 학습일 기록, 오프라인 설치 지원."
    />
    <meta name="theme-color" content="#1e272e" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Go2Japan" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta property="og:type" content="website" />

    <meta property="og:site_name" content="Go2Japan" />

    <meta
      property="og:description"
      content="틀린 글자가 더 자주 나오는 간격 반복으로 일본어 문자를 외우는 플래시카드 앱."

  <body>
    <div id="root"></div>
    <script>
      // beforeinstallprompt 는 로드 직후 한 번 발생하고 끝난다.
      // React 가 마운트되기 전에 지나가버리므로 여기서 먼저 붙잡아 둔다.
      window.__go2japanInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        window.__go2japanInstallPrompt = event;
        window.dispatchEvent(new Event('go2japan:installprompt'));
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
